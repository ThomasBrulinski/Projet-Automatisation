services:
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - res1
    depends_on:
      - frontend
  frontend:
    build: ./frontend
    restart: always
    networks:
      - res1
    depends_on:
      - backend-traitement
  backend-traitement:
    build: ./backend-traitement
    restart: always
    networks:
      - res1
      - res2
    environment:
      - C_SHARP_URL=${C_SHARP_URL}
    depends_on:
      - backend-interfacebdd
  backend-interfacebdd:
    build: ./backend-interfacebdd
    restart: always
    networks:
      - res2
      - res3
    depends_on:
      bdd:
        condition: service_healthy
  bdd:
    image: mariadb:10.6-focal
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PWD}
      - MARIADB_DATABASE=${DB_NAME}
    volumes:
      - ./bdd/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - res3
  
networks:
  res1:
    driver: bridge
  res2:
    driver: bridge
  res3:
    driver: bridge
