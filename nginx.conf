server {
    listen 80;

    client_max_body_size 50M;

    location /api/ {
        proxy_buffering off;
        proxy_request_buffering off;
        
        proxy_pass http://backend-traitement:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
